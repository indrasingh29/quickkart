name: QuickKart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install and build all apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            admin-panel/package-lock.json
            delivery-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace apps
        run: npm run install:all

      - name: Build frontends
        run: npm run build

      - name: Check backend syntax
        shell: bash
        run: find server/src -name "*.js" -print0 | xargs -0 -n1 node --check
