services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1.0.2
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: quickkart
    depends_on:
      mongo:
        condition: service_healthy

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/quickkart
      CLIENT_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      DELIVERY_URL: http://localhost:5175
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
